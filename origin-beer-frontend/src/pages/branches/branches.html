<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Beer — Branches</title>
    <link rel="stylesheet" href="../../shared.css">
    <link rel="stylesheet" href="branches.css">
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<main class="main">
    <div class="topbar">
        <div class="topbar-title">Branch Management</div>
        <div class="topbar-right">
            <div class="badge-online">Server active</div>
            <span id="todayDate"></span>
        </div>
    </div>

    <div class="content">
        <div class="page-header">
            <div>
                <h2>🏢 Branches</h2>
                <p>Origin Beer locations and franchises</p>
            </div>
            <button class="btn-new" onclick="openCreateModal()">＋ New Branch</button>
        </div>

        <div class="stats-mini" style="grid-template-columns: repeat(3, 1fr);">
            <div class="stat-mini">
                <span class="stat-mini-icon">🏢</span>
                <div><div class="stat-mini-val" id="totalBranches">—</div><div class="stat-mini-label">Total Branches</div></div>
            </div>
            <div class="stat-mini">
                <span class="stat-mini-icon">✅</span>
                <div><div class="stat-mini-val" id="totalActive">—</div><div class="stat-mini-label">Active</div></div>
            </div>
            <div class="stat-mini">
                <span class="stat-mini-icon">🔴</span>
                <div><div class="stat-mini-val" id="totalInactive">—</div><div class="stat-mini-label">Inactive</div></div>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="search" placeholder="Search by name, city or code..." oninput="filter()">
            </div>
            <select class="filter-select" id="filterStatus" onchange="filter()">
                <option value="">All statuses</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>

        <div class="result-info" id="resultInfo"></div>
        <div class="branches-grid" id="branchesGrid">
            <div style="grid-column:1/-1">
                <div class="empty-state"><span class="empty-icon">⏳</span><p>Loading branches...</p></div>
            </div>
        </div>
    </div>
</main>

<!-- ── CREATE / EDIT MODAL ───────────────────────────────────── -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalIfOutside(event)">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">🏢 New Branch</h3>
            <button class="modal-close" onclick="closeCreateModal()">✕</button>
        </div>
        <div class="modal-body">
            <div id="modalError" class="modal-error" style="display:none;"></div>

            <div class="form-row">
                <div class="form-group">
                    <label>Code <span class="required">*</span></label>
                    <input type="text" id="fCode" placeholder="e.g. BOG-01" maxlength="10">
                </div>
                <div class="form-group">
                    <label>Name <span class="required">*</span></label>
                    <input type="text" id="fName" placeholder="Branch display name" maxlength="100">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="fCity" placeholder="City" maxlength="80">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="fPhone" placeholder="+57 300 000 0000" maxlength="20">
                </div>
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text" id="fAddress" placeholder="Physical address" maxlength="200">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="fEmail" placeholder="branch@originbeer.com" maxlength="120">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeCreateModal()">Cancel</button>
            <button class="btn-primary" id="btnSave" onclick="saveBranch()">Create Branch</button>
        </div>
    </div>
</div>

<!-- ── ASSIGN USERS MODAL ────────────────────────────────────── -->
<div class="modal-overlay" id="assignOverlay" onclick="closeAssignIfOutside(event)">
    <div class="modal modal-wide">
        <div class="modal-header">
            <h3>👥 Assign Users — <span id="assignBranchName"></span></h3>
            <button class="modal-close" onclick="closeAssignModal()">✕</button>
        </div>
        <div class="modal-body">
            <div id="assignError" class="modal-error" style="display:none;"></div>
            <p class="assign-hint">Select the users who should have access to this branch.</p>
            <div id="userCheckList" class="user-check-list">
                <div class="empty-state"><span class="empty-icon">⏳</span><p>Loading users...</p></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeAssignModal()">Cancel</button>
            <button class="btn-primary" id="btnAssign" onclick="saveAssignments()">Save Assignments</button>
        </div>
    </div>
</div>

<script src="../../shared.js"></script>
<script src="branches.js"></script>
</body>
</html>
