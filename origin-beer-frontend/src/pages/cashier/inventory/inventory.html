<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Beer — Branch Inventory</title>
    <link rel="stylesheet" href="../../../shared.css">
    <link rel="stylesheet" href="inventory.css">
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<main class="main">
    <div class="topbar">
        <div class="topbar-title">Branch Inventory</div>
        <div class="topbar-right">
            <div class="badge-online">Server active</div>
            <span id="todayDate"></span>
        </div>
    </div>

    <div class="content">
        <div class="page-header">
            <div>
                <h2>📦 Inventory — <span id="branchNameHeader">Your Branch</span></h2>
                <p>Stock levels for your location</p>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-mini">
            <div class="stat-mini">
                <span class="stat-mini-icon">📦</span>
                <div><div class="stat-mini-val" id="statTotalItems">—</div><div class="stat-mini-label">Total Items</div></div>
            </div>
            <div class="stat-mini">
                <span class="stat-mini-icon">⚠️</span>
                <div><div class="stat-mini-val" id="statLowStock">—</div><div class="stat-mini-label">Low Stock</div></div>
            </div>
            <div class="stat-mini">
                <span class="stat-mini-icon">🛒</span>
                <div><div class="stat-mini-val" id="statProducts">—</div><div class="stat-mini-label">Products</div></div>
            </div>
            <div class="stat-mini">
                <span class="stat-mini-icon">💰</span>
                <div><div class="stat-mini-val" id="statTotalValue">—</div><div class="stat-mini-label">Total Value</div></div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="search" placeholder="Search by product or code..." oninput="filter()">
            </div>
            <select class="filter-select" id="filterStock" onchange="filter()">
                <option value="">All stock levels</option>
                <option value="low">⚠️ Low stock</option>
                <option value="ok">✅ Normal</option>
            </select>
        </div>

        <div class="result-info" id="resultInfo"></div>

        <!-- Table -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Stock</th>
                        <th>Min. Stock</th>
                        <th>Unit Price</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="inventoryTable">
                    <tr><td colspan="6"><div class="empty-state"><span class="empty-icon">⏳</span><p>Loading inventory...</p></div></td></tr>
                </tbody>
            </table>
            <div class="pagination">
                <span id="pageInfo">Loading...</span>
                <div class="pagination-btns" id="pageBtns"></div>
            </div>
        </div>
    </div>
</main>

<!-- ── STOCK EDIT MODAL ──────────────────────────────────── -->
<div class="modal-overlay" id="stockModalOverlay">
    <div class="modal">
        <div class="modal-header">
            <div>
                <h3>📦 Update Stock</h3>
                <p id="stockModalSub">Product · Branch</p>
            </div>
            <button class="modal-close" onclick="closeStockModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="stock-target" id="stockTarget"></div>
            <div class="form-row">
                <div class="form-group">
                    <label>QUANTITY <span class="required">*</span></label>
                    <input type="number" id="sQuantity" min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label>MIN. STOCK ALERT</label>
                    <input type="number" id="sMinStock" min="1" placeholder="5">
                </div>
            </div>
            <div id="stockError" class="form-error" style="display:none"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeStockModal()">Cancel</button>
            <button class="btn-save" id="btnSaveStock" onclick="saveStock()">Update Stock</button>
        </div>
    </div>
</div>

<script src="../../../shared.js"></script>
<script src="../../../shared.html"></script>
<script src="inventory.js"></script>

</body>
</html>
