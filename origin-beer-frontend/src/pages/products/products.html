<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Beer — Products</title>
    <link rel="stylesheet" href="../../shared.css">
    <link rel="stylesheet" href="products.css">
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<main class="main">
    <div class="topbar">
        <div class="topbar-title">Product Catalog</div>
        <div class="topbar-right">
            <div class="badge-online">Server active</div>
            <span id="todayDate"></span>
        </div>
    </div>

    <div class="content">
        <div class="page-header">
            <div>
                <h2>🛒 Products</h2>
                <p>Origin Beer master product catalog</p>
            </div>
        </div>

        <div class="stats-mini">
            <div class="stat-mini">
                <span class="stat-mini-icon">🛒</span>
                <div><div class="stat-mini-val" id="totalProducts">—</div><div class="stat-mini-label">Total</div></div>
            </div>
            <div class="stat-mini">
                <span class="stat-mini-icon">✅</span>
                <div><div class="stat-mini-val" id="totalActive">—</div><div class="stat-mini-label">Active</div></div>
            </div>
            <div class="stat-mini">
                <span class="stat-mini-icon">🏷️</span>
                <div><div class="stat-mini-val" id="totalCategories">—</div><div class="stat-mini-label">Categories</div></div>
            </div>
            <div class="stat-mini">
                <span class="stat-mini-icon">💰</span>
                <div><div class="stat-mini-val" id="avgPrice">—</div><div class="stat-mini-label">Avg. Price</div></div>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="search" placeholder="Search by name, code or category..." oninput="filter()">
            </div>
            <select class="filter-select" id="filterCategory" onchange="filter()">
                <option value="">All categories</option>
            </select>
            <select class="filter-select" id="filterStatus" onchange="filter()">
                <option value="">All statuses</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Unit</th>
                        <th>Sale Price</th>
                        <th>Cost Price</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="productsTable">
                    <tr><td colspan="6"><div class="empty-state"><span class="empty-icon">⏳</span><p>Loading products...</p></div></td></tr>
                </tbody>
            </table>
            <div class="pagination">
                <span id="pageInfo">Loading...</span>
                <div class="pagination-btns" id="pageBtns"></div>
            </div>
        </div>
    </div>
</main>

<script src="../../shared.js"></script>
<script src="products.js"></script>
</body>
</html>
