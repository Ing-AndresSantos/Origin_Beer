<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Beer — Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <span class="logo-icon">🍺</span>
            <h1>Origin Beer</h1>
            <p>Management System</p>
        </div>

        <div class="form-group">
            <label>Email address</label>
            <input type="email" id="email" placeholder="email@originbeer.com" autocomplete="off" />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" />
        </div>

        <button class="btn-login" id="btnLogin" onclick="login()">Sign In</button>

        <div class="message" id="message"></div>

        <p class="footer-text">© 2026 Origin Beer · SentinelDev</p>
    </div>

    <script src="login.js"></script>
</body>
</html>
