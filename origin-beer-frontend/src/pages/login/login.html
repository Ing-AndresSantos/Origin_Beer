<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Beer — Login</title>
    <link rel="stylesheet" href="../../shared.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Botón tema — esquina superior derecha -->
    <button class="btn-theme" id="btnTheme" onclick="toggleTheme()" title="Toggle theme">
        <span id="themeIcon">🌙</span>
    </button>

    <div class="login-container">
        <div class="logo">
            <span class="logo-icon">🍺</span>
            <h1>Origin Beer</h1>
            <p>Management System</p>
        </div>

        <div class="form-group">
            <label>Email address</label>
            <input type="email" id="email" placeholder="email@originbeer.com" autocomplete="off" />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" />
        </div>

        <button class="btn-login" id="btnLogin" onclick="login()">Sign In</button>

        <div class="message" id="message"></div>

        <p class="footer-text">© 2026 Origin Beer · SentinelDev</p>
    </div>

    <script src="../../shared.js"></script>
    <script src="login.js"></script>
    <script>
        // ── THEME TOGGLE ──
        function applyTheme(theme) {
            const icon = document.getElementById('themeIcon');
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                icon.textContent = '☀️';
            } else {
                document.body.classList.remove('light-mode');
                icon.textContent = '🌙';
            }
        }

        function toggleTheme() {
            const isLight = document.body.classList.contains('light-mode');
            const next = isLight ? 'dark' : 'light';
            localStorage.setItem('theme', next);
            applyTheme(next);
        }

        // Aplicar tema guardado al cargar
        (function () {
            const saved = localStorage.getItem('theme') || 'dark';
            applyTheme(saved);
        })();
    </script>
</body>
</html>
