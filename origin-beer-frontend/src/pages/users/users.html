<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Beer — Users</title>
    <link rel="stylesheet" href="../../shared.css">
    <link rel="stylesheet" href="users.css">
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<main class="main">
    <div class="topbar">
        <div class="topbar-title">User Management</div>
        <div class="topbar-right">
            <div class="badge-online">Server active</div>
            <span id="todayDate"></span>
        </div>
    </div>

    <div class="content">
        <div class="page-header">
            <div>
                <h2>👥 Users</h2>
                <p>Full list of users registered in the system</p>
            </div>
        </div>

        <div class="stats-mini">
            <div class="stat-mini">
                <span class="stat-mini-icon">👥</span>
                <div><div class="stat-mini-val" id="totalUsers">—</div><div class="stat-mini-label">Total</div></div>
            </div>
            <div class="stat-mini">
                <span class="stat-mini-icon">✅</span>
                <div><div class="stat-mini-val" id="totalActive">—</div><div class="stat-mini-label">Active</div></div>
            </div>
            <div class="stat-mini">
                <span class="stat-mini-icon">🔴</span>
                <div><div class="stat-mini-val" id="totalInactive">—</div><div class="stat-mini-label">Inactive</div></div>
            </div>
            <div class="stat-mini">
                <span class="stat-mini-icon">🛡️</span>
                <div><div class="stat-mini-val" id="totalAdmins">—</div><div class="stat-mini-label">Admins</div></div>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="search" placeholder="Search by name, email or role..." oninput="filter()">
            </div>
            <select class="filter-select" id="filterRole" onchange="filter()">
                <option value="">All roles</option>
                <option value="ADMIN">Admin</option>
                <option value="CAJERO">Cashier</option>
                <option value="MESERO">Waiter</option>
            </select>
            <select class="filter-select" id="filterStatus" onchange="filter()">
                <option value="">All statuses</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Role</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Last Access</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody id="usersTable">
                    <tr><td colspan="6"><div class="empty-state"><span class="empty-icon">⏳</span><p>Loading users...</p></div></td></tr>
                </tbody>
            </table>
            <div class="pagination">
                <span id="pageInfo">Loading...</span>
                <div class="pagination-btns" id="pageBtns"></div>
            </div>
        </div>
    </div>
</main>

<script src="../../shared.js"></script>
<script src="users.js"></script>
</body>
</html>
